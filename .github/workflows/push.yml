# Sends check-in reminders and "QK updated your plan" to phones while the app is closed.
# One-time setup: add these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (mailto:you@…)
# Make the VAPID pair with `node tools/webpush.mjs keys`, and put the public key in js/cloud-config.js too.
# Without the secrets the job runs and sends nothing.
name: Push reminders
on:
  schedule:
    - cron: '30 3 * * *'   # 08:30 Pakistan, 07:30 UAE: check-in mornings
    - cron: '30 13 * * *'  # 18:30 Pakistan: plan updates QK made during the day
    - cron: '5 * * * *'    # every hour: QK's broadcasts from the dashboard (only those)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/push-checkins.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_ONLY: ${{ github.event.schedule == '5 * * * *' && 'broadcasts' || '' }}
