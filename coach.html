<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4EF">
  <title>QK Coach</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/coach.css">
</head>
<body class="coach-page">
<main class="cd">
  <header class="cd-head">
    <div><span class="eyebrow">Shred by QK</span><h1 class="display h1">Coach dashboard</h1></div>
    <div class="cd-me" id="cdMe"></div>
  </header>
  <p class="cd-demo" id="cdDemo" hidden><b>Sample clients.</b> Connect the server (see <code>supabase/README.md</code>) to see your real clients.</p>

  <section class="card stack" id="cdLogin" hidden>
    <h2 class="display h2">Sign in</h2>
    <p class="muted small" style="margin:0">We'll email you a 6-digit code. No password.</p>
    <label class="field">Email<input id="cdEmail" type="email" autocomplete="email" placeholder="you@example.com"></label>
    <button class="cta" type="button" id="cdSend">Email me a code</button>
    <div id="cdCodeWrap" hidden class="stack"><label class="field">6-digit code<input id="cdCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button class="cta" type="button" id="cdVerify">Sign in</button></div>
    <p class="cd-err" id="cdErr" hidden></p>
  </section>

  <section id="cdMain" hidden>
    <div class="cd-stats" id="cdStats"></div>
    <div class="cd-tools">
      <div class="seg" id="cdFilter" role="group" aria-label="Filter clients">
        <button type="button" data-f="all" class="on">All</button><button type="button" data-f="inactive">Inactive</button><button type="button" data-f="slipping">Slipping</button><button type="button" data-f="on track">On track</button>
      </div>
      <input id="cdSearch" type="search" placeholder="Search clients" aria-label="Search clients">
    </div>
    <div class="cd-grid">
      <div class="cd-list" id="cdList" role="list"></div>
      <aside class="card cd-detail" id="cdDetail" aria-live="polite"><p class="empty">Pick a client to see their week, lifts and form, and to send a message.</p></aside>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/coach-page.js"></script>
</body>
</html>
